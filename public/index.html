<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Scalar Yield</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/brand/icon-180.png">
<meta name="theme-color" content="#F8F0E3">
<style>
  @font-face{font-family:"Playfair Display";src:url("/fonts/playfair.woff2") format("woff2");font-weight:400 900;font-display:swap}
  @font-face{font-family:Inter;src:url("/fonts/inter.woff2") format("woff2");font-weight:100 900;font-display:swap}
</style>
<style>
  :root{
    --cream:#F8F0E3; --surface:#FFFDF8; --ink:#241610;
    --terracotta:#BC5B33; --deep:#9C4522; --tan:#E8D5B8; --muted:#7A6A58;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh; display:grid; place-items:center; padding:32px;
    background:var(--cream); color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  .card{
    width:100%; max-width:680px; padding:clamp(28px,6vw,64px);
    background:var(--surface); border:1px solid var(--tan);
    border-radius:22px; text-align:center;
    box-shadow:0 30px 70px -60px rgba(36,22,16,.85);
  }
  .emblem{width:clamp(96px,22vw,150px);height:auto;margin-bottom:clamp(18px,4vw,30px)}
  h1{
    font-family:"Playfair Display",Georgia,"Times New Roman",serif;
    font-weight:700; font-size:clamp(38px,9vw,74px); line-height:.95;
    letter-spacing:.035em; text-transform:uppercase;
  }
  h1 .yield{color:var(--terracotta)}
  .rule{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin:clamp(20px,4vw,30px) 0;
  }
  .rule i{height:1px; flex:1; max-width:220px; background:var(--tan)}
  .rule s{
    width:7px; height:7px; background:var(--terracotta);
    transform:rotate(45deg); border-radius:1px;
  }
  .tag{
    font-weight:700; font-size:clamp(11px,2.2vw,15px);
    letter-spacing:.22em; text-transform:uppercase; color:var(--muted);
  }
  .note{
    margin-top:clamp(26px,5vw,38px); padding-top:clamp(18px,3vw,24px);
    border-top:1px solid var(--tan);
    font-size:13px; line-height:1.7; color:var(--muted);
  }
</style>
</head>
<body>
  <main class="card">
    <img class="emblem" src="/brand/emblem-transparent.png" alt="Scalar Yield emblem">
    <h1>Scalar <span class="yield">Yield</span></h1>
    <div class="rule"><i></i><s></s><i></i></div>
    <p class="tag">Analyse · Capitalise · Maximise</p>
    <p class="note">
      Deployment pipeline is live. The site is being built.
    </p>
  </main>
</body>
</html>
